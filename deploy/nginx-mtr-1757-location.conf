# Add these locations to the phm.railiverse.com server block.
#
# The exact-match rule is important. Without it, nginx's automatic
# directory redirect can build an http:// Location header when nginx is
# behind CloudFront, which breaks the public HTTPS integration URL.

location = /mtr-1757 {
    return 308 https://$host/mtr-1757/$is_args$args;
}

location /mtr-1757/ {
    proxy_pass http://16.163.66.139:8050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
